# Ascent - the three gates, with the same commands as ./dev.sh, on every push and
# pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  gates:
    name: lint, test, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Distribution packages rather than a Lua setup action: apt already has the
      # toolchain, and the action downloads luajit from an external archive.
      #
      # Here busted runs the suite on PUC Lua 5.1, not on LuaJIT as it does
      # locally. Both have 5.1 semantics and the suite asserts _VERSION; the smoke
      # harness still runs on LuaJIT.
      - name: install the lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            luajit lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install luacheck
          luajit -v
          busted --version
          luacheck --version

      - run: ./dev.sh lint
      - run: ./dev.sh test
      - run: ./dev.sh smoke
