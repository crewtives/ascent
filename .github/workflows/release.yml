# Ascent - cut a release and hand it to CurseForge.
#
# A `v*` tag builds the zip and uploads it as a beta; the Actions tab can publish
# it as another release type. The version, the supported clients and the notes
# come from the TOC and CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: What to publish this as
        type: choice
        default: beta
        options: [alpha, beta, release]

env:
  # Public: the number in the project's CurseForge URL. Its token is a repository
  # secret.
  CF_PROJECT_ID: "1706237"

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gates
    runs-on: ubuntu-latest
    # Only crewtives/ascent publishes. The gates above run wherever a tag is pushed.
    if: github.repository == 'crewtives/ascent'
    # Only for the GitHub release below; the CurseForge upload uses its own token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the TOC would ship a zip whose name and contents
      # give different versions.
      - name: the tag agrees with the TOC
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^## Version: *//p' Ascent/Ascent.toc | head -1 | tr -d '\r')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, the TOC says $declared" >&2
            exit 1
          fi
          echo "both say $declared"

      - name: build the zip
        run: ./dev.sh package

      # Kept on the run, so the exact file sent to CurseForge can be downloaded later.
      - uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ./tools/curseforge-upload.sh \
            --release-type "${{ github.event.inputs.release_type || 'beta' }}"

      # After the CurseForge upload, so a rejected upload leaves no release behind
      # and the workflow can simply run again. The release keeps the zip at a
      # lasting URL, with the notes the upload used.
      - name: publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'beta' }}
        run: |
          ./tools/release-notes.sh > release-notes.md

          prerelease=--prerelease
          [ "$RELEASE_TYPE" = "release" ] && prerelease=""

          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Ascent ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            $prerelease
